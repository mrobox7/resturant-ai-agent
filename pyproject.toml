[project]
name = "ai-agent"
version = "0.1.0"
description = "LangGraph agent behind a FastAPI endpoint"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "langgraph>=0.2",
    "logfire>=0.50",
    "openai>=1.51",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "requests>=2.32",
    "streamlit>=1.41",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
